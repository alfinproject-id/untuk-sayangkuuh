<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7f8">
<title>A Little Surprise 💌</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

:root {
  --pink: #ff8eae;
  --rose: #d95783;
  --purple: #b5a1ed;
  --cream: #fff8f6;
  --ink: #533848;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 10% 15%, #ffd8e6 0, transparent 35%),
    radial-gradient(ellipse at 90% 80%, #e6dcff 0, transparent 40%),
    #fff7f8;
}

button {
  font: inherit;
  cursor: pointer;
  border: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

button:focus { outline: none; box-shadow: none; }
button:focus:not(:focus-visible) { outline: none; }
button:focus-visible { outline: 2px solid #d95783; outline-offset: 3px; }

.hidden { display: none !important; }

/* PEMBUKA SURAT */
#intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 24px;
  background:
    radial-gradient(ellipse at 15% 15%, #ffe0ea, transparent 45%),
    radial-gradient(ellipse at 85% 85%, #e8ddff, transparent 45%),
    #fff7f8;
  transition: opacity .8s, visibility .8s;
}
#intro.dismiss { opacity: 0; visibility: hidden; pointer-events: none; }

.intro-small {
  color: #b56d8a;
  letter-spacing: 4px;
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 28px;
  text-align: center;
}
.envelope-button {
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  animation: envelopeFloat 3s ease-in-out infinite;
  border-radius: 12px;
}
.envelope {
  position: relative;
  width: 190px;
  height: 135px;
  background: #f4a4bf;
  border-radius: 8px;
  box-shadow: 0 22px 50px #d9578333;
  overflow: hidden;
}
.envelope::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, #ffc8d8, #ed8eae);
  clip-path: polygon(0 0, 100% 0, 50% 61%);
  z-index: 2;
}
.envelope::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #e887a9;
  clip-path: polygon(0 100%, 50% 46%, 100% 100%);
  z-index: 3;
}
.letter-paper {
  position: absolute;
  z-index: 1;
  background: #fffaf5;
  width: 145px;
  height: 105px;
  top: 12px;
  left: 23px;
  border-radius: 4px;
  color: #d95783;
  padding-top: 18px;
  font-size: 32px;
}
.seal {
  position: absolute;
  z-index: 5;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #fff3f7;
  color: #cf5d87;
  display: grid;
  place-items: center;
  left: calc(50% - 18px);
  top: 61px;
  box-shadow: 0 3px 8px #9d416333;
  font-size: 17px;
}
.tap-text { font-size: 13px; color: #9d6a83; letter-spacing: 1px; }

@keyframes envelopeFloat {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-9px) rotate(1deg); }
}

/* HALAMAN UTAMA */
#main {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1s;
  isolation: isolate;
}
#main.visible { opacity: 1; }

.topbar {
  position: relative;
  z-index: 10;
  width: min(100%, 1000px);
  margin: auto;
  padding: 25px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { font-family: 'Playfair Display', serif; font-size: 19px; color: #c75b85; }
.music-status {
  background: #ffffffb8;
  border: 1px solid #ffffff;
  border-radius: 30px;
  padding: 9px 12px;
  font-size: 11px;
  color: #a45c7c;
  display: flex;
  align-items: center;
  gap: 7px;
}
.music-dot {
  width: 7px;
  height: 7px;
  background: #e76b98;
  border-radius: 50%;
  animation: pulse 1.3s infinite;
}
@keyframes pulse { 50% { box-shadow: 0 0 0 5px #f5a8c533; } }


/* KONTEN UTAMA — TIPOGRAFI DIKEMBALIKAN KE DESAIN AWAL */
.content {
  position: relative;
  z-index: 2;
  width: min(570px, 90%);
  margin: 55px auto 0;
  padding: 25px 24px 30px;
  text-align: center;
}
.eyebrow {
  display: inline-block;
  background: #fff9fccc;
  border: 1px solid #fff;
  color: #bc7190;
  border-radius: 30px;
  padding: 9px 15px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 23px;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 8vw, 70px);
  font-weight: 500;
  line-height: 1.13;
  letter-spacing: -2px;
}
h1 span {
  display: block;
  color: #d96691;
  font-style: italic;
  overflow-wrap: anywhere;
}
.subtitle {
  max-width: 370px;
  margin: 20px auto 28px;
  color: #987c8c;
  font-size: 13px;
  line-height: 1.9;
  white-space: pre-line;
}
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  margin: 25px 0;
  color: #d887a5;
}
.divider::before, .divider::after {
  content: "";
  height: 1px;
  width: 50px;
  background: #eac4d3;
}

/* MENU UNIK */
.menu {
  display: flex;
  flex-direction: column;
  gap: 11px;
  width: min(340px, 100%);
  margin: auto;
}
.menu-button {
  background: #ffffffcf;
  border: 1px solid #ffffff;
  border-radius: 15px;
  padding: 15px 17px;
  display: flex;
  align-items: center;
  gap: 13px;
  text-align: left;
  color: var(--ink);
  box-shadow: 0 6px 20px #c78ca512;
  transition: transform .2s, background .2s;
}
.menu-button:hover { transform: translateY(-3px); background: #fff; }
.menu-button:active { transform: scale(.985); background: #fff5f8; }
.menu-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 19px;
  background: #ffebf2;
  flex-shrink: 0;
}
.menu-label { flex: 1; }
.menu-label strong { display: block; font-size: 12px; margin-bottom: 4px; }
.menu-label small { color: #a18a98; font-size: 10px; }
.arrow { color: #d88aa7; font-size: 18px; }

.footer {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 40px 20px 28px;
  color: #bd8da3;
  font-size: 11px;
  letter-spacing: .5px;
}

/* POPUP: FOTO MENJADI BACKGROUND AESTHETIC SAAT MENU DIKLIK */
.modal {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(81, 51, 68, .58);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .3s, visibility .3s;
  overflow: hidden;
}
.modal.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}


/* FOTO TAMPIL DI DEPAN KARTU POPUP */
.popup-photo {
  position: fixed;
  z-index: 70;
  width: clamp(90px, 24vw, 135px);
  padding: 6px 6px 16px;
  background: #fffdfb;
  border-radius: 4px;
  box-shadow: 0 12px 30px rgba(35, 15, 35, .25);
  pointer-events: none;
  opacity: 0;
  transition: opacity .4s ease, transform .5s ease;
}

.popup-photo img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
}

/* Posisi foto di sudut layar */
.popup-photo.p1 {
  top: 17%;
  left: 2%;
  transform: translateX(-20px) rotate(-12deg);
}

.popup-photo.p2 {
  top: 17%;
  right: 2%;
  transform: translateX(20px) rotate(12deg);
}

.popup-photo.p3 {
  bottom: 8%;
  left: 2%;
  transform: translateX(-20px) rotate(8deg);
}

.popup-photo.p4 {
  bottom: 8%;
  right: 2%;
  transform: translateX(20px) rotate(-8deg);
}

/* Foto muncul di atas kartu */
.modal.open .popup-photo {
  opacity: 1;
}

.modal.open .popup-photo.p1,
.modal.open .popup-photo.p2,
.modal.open .popup-photo.p3,
.modal.open .popup-photo.p4 {
  transform: translateX(0) rotate(0deg);
}

.modal-card {
  position: relative;
  z-index: 60;
  width: min(420px, 100%);
  max-height: 78vh;
  overflow-y: auto;
  background: rgba(255, 250, 248, .94);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 25px;
  padding: 30px 24px;
  text-align: center;
  box-shadow: 0 25px 80px #381a302e;
  backdrop-filter: blur(12px);
  transform: translateY(15px) scale(.98);
  transition: transform .3s;
}
.modal.open .modal-card { transform: translateY(0) scale(1); }
.modal-emoji { font-size: 36px; margin-bottom: 15px; }
.modal-card h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: #ce618a;
  margin-bottom: 17px;
}
.modal-card p {
  color: #806779;
  font-size: 13px;
  line-height: 2;
  white-space: pre-line;
  overflow-wrap: anywhere;
}
.close-btn {
  margin-top: 24px;
  border-radius: 30px;
  padding: 12px 25px;
  background: #f8e2ec;
  color: #b34d79;
  font-size: 12px;
  font-weight: 700;
}
.close-btn:active { background: #f2d5e2; }

/* HATI MELAYANG */
.heart {
  position: fixed;
  bottom: -30px;
  z-index: 20;
  pointer-events: none;
  animation: heartRise linear forwards;
}
@keyframes heartRise {
  to { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
}

/* RESPONSIF HP */
@media (max-width: 600px) {
  .topbar { padding: 19px 18px; }
  .content { margin-top: 35px; padding: 20px 12px 25px; }
  h1 { font-size: clamp(43px, 12vw, 61px); }
  .subtitle { max-width: 290px; font-size: 12px; }

  .menu { width: min(330px, 100%); }
  .menu-button { padding: 12px; }
  .footer { padding-top: 35px; }

  .popup-photo { width: 92px; padding: 5px 5px 14px; }
  .popup-photo.p1 { top: 8%; left: 2%; }
  .popup-photo.p2 { top: 10%; right: 2%; }
  .popup-photo.p3 { bottom: 7%; left: 3%; }
  .popup-photo.p4 { bottom: 6%; right: 3%; }
  .modal-card { padding: 26px 19px; }
  .modal-card h2 { font-size: 25px; }
  .modal-card p { font-size: 12px; line-height: 1.9; }
}

@media (max-width: 360px) {
  .popup-photo { width: 76px; }
  .modal-card { max-height: 75vh; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- PEMBUKA SURAT -->
<section id="intro">
  <div class="intro-small">SOMEONE MADE THIS FOR YOU</div>
  <button class="envelope-button" id="openLetter" aria-label="Buka surat kejutan">
    <div class="envelope">
      <div class="letter-paper">♡</div>
      <div class="seal">♥</div>
    </div>
    <span class="tap-text">Ada surat untukmu · klik untuk membuka</span>
  </button>
</section>

<!-- BACKSOUND -->
<audio id="music" src="https://c.termai.cc/a167/qCpFqD.mp3" loop preload="auto"></audio>

<main id="main" class="hidden">
  <nav class="topbar">
    <div class="brand">dear, you ♡</div>
    <button class="music-status" id="musicToggle">
      <span class="music-dot"></span>
      <span id="musicLabel">Music is playing</span>
    </button>
  </nav>

  <section class="content">
    <div class="eyebrow">A LITTLE SURPRISE FOR YOU ✦</div>
    <h1>Happy Birthday<span id="personName">Sayang</span></h1>
    <p class="subtitle" id="introText"></p>
    <div class="divider">♡</div>

    <div class="menu">
      <button class="menu-button" data-message="letter">
        <span class="menu-icon">💌</span>
        <span class="menu-label">
          <strong>Surat Kecil Untukmu</strong>
          <small>Ada beberapa kata dari hati</small>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="menu-button" data-message="special">
        <span class="menu-icon">🎂</span>
        <span class="menu-label">
          <strong>Pesan Spesial</strong>
          <small>Doa dan harapan untuk hari ini</small>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="menu-button" data-message="reasons">
        <span class="menu-icon">🧸</span>
        <span class="menu-label">
          <strong>Hal yang Membuatmu Istimewa</strong>
          <small>Jangan lupa betapa berharganya dirimu</small>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="menu-button" data-message="wish">
        <span class="menu-icon">🌷</span>
        <span class="menu-label">
          <strong>Harapan untuk Tahun Ini</strong>
          <small>Semoga banyak hal baik datang padamu</small>
        </span>
        <span class="arrow">›</span>
      </button>
    </div>

    <div class="divider">✧</div>
    <p style="font-size:11px;color:#b48ba0">Made with love, just for you ♡</p>
  </section>

  <footer class="footer">
    Dibuat oleh Alfin Project
  </footer>
</main>

<!-- POPUP DENGAN FOTO SEBAGAI BACKGROUND -->
<div class="modal" id="modal"
  role="dialog" aria-modal="true"
  aria-labelledby="modalTitle"
  aria-hidden="true">

  <div class="popup-photo p1"><img src="https://c.termai.cc/i185/bMO.jpg" alt=""></div>
  <div class="popup-photo p2"><img src="https://c.termai.cc/i178/KAqyN.jpg" alt=""></div>
  <div class="popup-photo p3"><img src="https://c.termai.cc/i107/qRhWd.jpg" alt=""></div>
  <div class="popup-photo p4"><img src="https://c.termai.cc/i112/VGsE7Y.jpg" alt=""></div>

  <div class="modal-card">
    <div class="modal-emoji" id="modalEmoji">💌</div>
    <h2 id="modalTitle">Surat Kecil Untukmu</h2>
    <p id="modalText"></p>
    <button class="close-btn" id="closeModal">Kembali ♡</button>
  </div>
</div>

<script>
/* =================================
   KONFIGURASI WEBSITE
================================= */
const CONFIG = {
  nama: "Freya",

  pembuka:
    "Hari ini bukan hari biasa.\nAda sedikit hal yang ingin aku sampaikan khusus untukmu.\nSiap membuka beberapa kejutan kecil? ♡",

  surat:
    "Hai, kamu yang hari ini sedang berulang tahun 💌\n\nSelamat bertambah usia. Semoga hari ini menjadi salah satu hari yang membuatmu tersenyum lebih banyak.\n\nAku membuat halaman kecil ini supaya ada sesuatu yang bisa kamu buka dan kenang. Mungkin sederhana, tapi semoga bisa membuat harimu terasa sedikit lebih spesial.\n\nJangan lupa bahagia, ya. Kamu pantas mendapatkan banyak hal baik. ♡",

  spesial:
    "Selamat ulang tahun! 🎂\n\nSemoga kamu selalu diberi kesehatan, umur yang berkah, hati yang tenang, rezeki yang lancar, dan jalan yang mudah untuk setiap langkahmu.\n\nSemoga apa pun yang sedang kamu perjuangkan perlahan menemukan jalannya. Semoga kamu selalu punya alasan untuk tersenyum, bahkan pada hari-hari yang terasa berat.\n\nHari ini adalah tentang kamu. Nikmati harimu, ya! 💗",

  alasan:
    "Kamu istimewa bukan karena harus selalu sempurna.\n\nKamu tetap berharga saat sedang lelah, saat belum mencapai impianmu, dan saat kamu merasa belum menjadi versi terbaik dirimu.\n\nJangan terlalu keras pada diri sendiri. Kamu sudah berjalan sejauh ini, dan itu juga sesuatu yang patut dibanggakan.\n\nTeruslah menjadi dirimu sendiri. Dunia membutuhkan lebih banyak kebaikan seperti yang kamu punya. 🌷",

  harapan:
    "Untuk usia yang baru ini, semoga lebih banyak pintu baik terbuka untukmu.\n\nSemoga kamu bertemu orang-orang yang tulus, mendapat kesempatan yang baik, bisa membanggakan dirimu sendiri, dan memiliki keberanian untuk mencoba hal-hal baru.\n\nSemoga hal yang membuatmu menangis diganti dengan ketenangan, hal yang kamu tunggu datang pada waktu yang tepat, dan setiap usahamu membuahkan hasil.\n\nSatu per satu, semoga doa baikmu menjadi nyata. ✨"
};

const $ = id => document.getElementById(id);
const intro = $("intro");
const main = $("main");
const music = $("music");
const modal = $("modal");

$("personName").textContent = CONFIG.nama;
$("introText").textContent = CONFIG.pembuka;
document.title = `Happy Birthday, ${CONFIG.nama} ♡`;

/* BUKA SURAT DAN MULAI MUSIK */
let opened = false;

$("openLetter").addEventListener("click", async () => {
  if (opened) return;
  opened = true;

  intro.classList.add("dismiss");
  main.classList.remove("hidden");

  requestAnimationFrame(() => main.classList.add("visible"));

  try {
    await music.play();
    $("musicLabel").textContent = "Music is playing";
  } catch (error) {
    $("musicLabel").textContent = "Putar musik";
  }

  startHearts();
});

/* KONTROL MUSIK */
$("musicToggle").addEventListener("click", async () => {
  if (music.paused) {
    try {
      await music.play();
      $("musicLabel").textContent = "Music is playing";
    } catch (error) {
      $("musicLabel").textContent = "Musik belum tersedia";
    }
  } else {
    music.pause();
    $("musicLabel").textContent = "Musik dijeda";
  }
});

/* MENU KEJUTAN */
const messages = {
  letter: {
    emoji: "💌",
    title: "Surat Kecil Untukmu",
    text: () => CONFIG.surat
  },
  special: {
    emoji: "🎂",
    title: "Pesan Spesial",
    text: () => CONFIG.spesial
  },
  reasons: {
    emoji: "🧸",
    title: "Kamu Itu Istimewa",
    text: () => CONFIG.alasan
  },
  wish: {
    emoji: "🌷",
    title: "Harapan untukmu",
    text: () => CONFIG.harapan
  }
};

let lastButton = null;

document.querySelectorAll("[data-message]").forEach(button => {
  button.addEventListener("click", () => {
    const item = messages[button.dataset.message];
    if (!item) return;

    lastButton = button;
    $("modalEmoji").textContent = item.emoji;
    $("modalTitle").textContent = item.title;
    $("modalText").textContent = item.text();

    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    $("closeModal").focus({ preventScroll: true });
  });
});

function closeMessage() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";

  if (lastButton) lastButton.focus({ preventScroll: true });
}

$("closeModal").addEventListener("click", closeMessage);

modal.addEventListener("click", event => {
  if (event.target === modal) closeMessage();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && modal.classList.contains("open")) {
    closeMessage();
  }
});

/* HATI MELAYANG */
let heartInterval = null;

function startHearts() {
  if (heartInterval) return;

  heartInterval = setInterval(() => {
    if (document.hidden) return;

    const heart = document.createElement("span");
    heart.className = "heart";
    heart.textContent = ["♡", "♥", "✧", "💕"][Math.floor(Math.random() * 4)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (12 + Math.random() * 15) + "px";
    heart.style.color = ["#ef8bab", "#c4a5f5", "#e7a6c4"][Math.floor(Math.random() * 3)];
    heart.style.animationDuration = (6 + Math.random() * 5) + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 12000);
  }, 1100);
}
</script>

</body>
</html>
